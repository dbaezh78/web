Para pasar tu aplicación de Prueba interna a Producción (para que esté pública para todo el mundo en la Play Store), debes cumplir con las políticas vigentes de Google.

Al ser una Cuenta personal de desarrollador, Google exige cumplir con un requisito obligatorio de pruebas antes de permitirte lanzar la app al público:

El requisito de Google para cuentas personales:
20 Probadores (Testers): Debes conseguir que al menos 20 personas se registren en tu canal de Prueba cerrada (Closed Testing).
14 Días activos: Esos 20 probadores deben descargar la aplicación en sus celulares y mantenerla instalada de forma continua durante al menos 14 días seguidos.
Solicitar acceso a Producción: Una vez que se cumplan esos 14 días con los 20 probadores activos, la consola te habilitará un botón para solicitar a Google el paso oficial a Producción. Google revisará tu app y la publicará para todo el público.
¿Qué debes hacer ahora en la consola para iniciar este proceso?
En la pantalla que me muestras, haz clic sobre tu aplicación Biblia Digital de Jerusalem (o en la flecha azul de la derecha ➔) para entrar a su panel.
En el panel, busca la sección "Termina de configurar tu aplicación" y completa las tareas obligatorias que te pide Google (son formularios sencillos):
Proporcionar una política de privacidad (puedes usar una plantilla estándar en una web de GitHub).
Indicar si tu app tiene anuncios (selecciona No).
Clasificación de contenido (responder un test rápido de preguntas sobre violencia, lenguaje, etc. para definir la edad recomendada).
Público objetivo (seleccionar la edad de los lectores, por ejemplo, Apto para todo público o Mayores de 13 años).
Ve a la sección de "Prueba cerrada" en el menú de la izquierda, crea una lista con los correos de tus 20 probadores y sube el archivo .aab allí también.
💡 Mi consejo:
Como conseguir 20 probadores durante 14 días puede tomar un poco de tiempo organizarlo, puedes seguir usando la "Prueba interna" para ti y tu círculo cercano (hasta 100 personas) de manera inmediata y sin restricciones de tiempo ni revisiones de Google. Cuando quieras dar el paso de publicarla a nivel mundial, inicias la configuración de la Prueba cerrada y los cuestionarios de la tienda.
